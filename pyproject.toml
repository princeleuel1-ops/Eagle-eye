[project]
name = "eagle-eye-zenith"
version = "6.0.0"
description = "Proof-backed supply-chain decision vertical slice + V6 pilot forge"
requires-python = ">=3.11"
dependencies = ["cryptography>=46.0.7,<47"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
